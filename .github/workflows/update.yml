name: Rebuild index and deploy

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC (3:17 am Pacific)
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: openneuro-index-${{ github.run_id }}
          restore-keys: openneuro-index-

      - name: Build index
        run: python build_index.py --cache cache --out site --workers 32

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: openneuro-index-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
